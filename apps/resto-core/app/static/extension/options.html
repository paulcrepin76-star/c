<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Collector options</title>
  <style>
    body { font: 16px/1.45 "SF Pro Text", "Segoe UI", system-ui, sans-serif; max-width: 520px; margin: 32px; color: #1c1b19; }
    label { display: block; margin: 12px 0 6px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin: 16px 8px 0 0; padding: 10px 16px; }
    .muted { color: #6e6a63; }
    .err { color: #b42318; }
    .ok { color: #2c6a4a; }
  </style>
</head>
<body>
  <h1>Restaurant Price Collector</h1>
  <p>This talks to the Survey Cafe cellar on port <b>8088</b>. It does not talk to n8n (5678) and it does not crawl Sam's. Copy the key from <a href="http://100.116.48.120:8088/collector" target="_blank" rel="noreferrer">Prices</a> on the cellar. After Test connection, open a Sam's page you are already shopping and send that page.</p>
  <label>Cellar URL
    <input id="cellarUrl" placeholder="http://100.116.48.120:8088">
  </label>
  <label>Cellar API key
    <input id="apiKey" type="password" autocomplete="off">
  </label>
  <button id="save" type="button">Save</button>
  <button id="test" type="button">Test connection</button>
  <p id="status" class="muted"></p>
  <script src="options.js"></script>
</body>
</html>

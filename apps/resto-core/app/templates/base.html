<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Survey Cafe">
  <meta name="theme-color" content="#0f1116">
  <title>{% block title %}Survey Cafe{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=12">
</head>
<body class="app">
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="mark">SC</span>
      <span class="brand-copy">
        <strong>Survey Cafe</strong>
        <em>Bonita Springs</em>
      </span>
    </a>
    <nav>
      <p class="nav-label">Performance</p>
      <a href="/" class="{% if page == 'dashboard' %}on{% endif %}">Dashboard</a>
      <a href="/finance" class="{% if page == 'finance' %}on{% endif %}">Finance</a>
      <a href="/costing" class="{% if page == 'costing' %}on{% endif %}">Recipes &amp; cost</a>
      <p class="nav-label">Purchasing</p>
      <a href="/invoices" class="{% if page == 'invoices' %}on{% endif %}">Orders</a>
      <a href="/invoices/scan" class="{% if page == 'scan' %}on{% endif %}">Scan invoice</a>
      <a href="/purchasing" class="{% if page == 'purchasing' %}on{% endif %}">Price compare</a>
      <a href="/collector" class="{% if page == 'collector' %}on{% endif %}">Vendor logins</a>
      <p class="nav-label">House</p>
      <a href="/house" class="{% if page == 'house' %}on{% endif %}">Fridges &amp; cameras</a>
      <a href="/inventory" class="{% if page == 'inventory' %}on{% endif %}">Inventory</a>
      <a href="/wines" class="{% if page == 'wines' %}on{% endif %}">Wine cellar</a>
      <p class="nav-label">Setup</p>
      <a href="/connect" class="{% if page == 'connect' %}on{% endif %}">Connections</a>
    </nav>
  </aside>
  <div class="shell">
    <header class="topbar">
      <form class="top-search" action="/inventory" method="get">
        <input type="search" name="q" placeholder="Search wines and inventory" value="{{ request.query_params.get('q', '') }}">
      </form>
      <div class="top-tools">
        <a class="top-link" href="/house">House</a>
        <a class="top-link" href="/purchasing">Purchasing</a>
        <button type="button" class="theme-btn" id="theme-toggle" aria-label="Switch theme">Theme</button>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    (function () {
      const root = document.documentElement;
      const stored = localStorage.getItem("resto-theme");
      if (stored) root.setAttribute("data-theme", stored);
      const btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
        localStorage.setItem("resto-theme", next);
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>

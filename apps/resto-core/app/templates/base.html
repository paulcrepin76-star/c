<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Survey">
  <meta name="theme-color" content="#f6f5f2">
  <title>{% block title %}Survey Cafe{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Survey</a>
    <nav>
      <a href="/" class="{% if page == 'dashboard' %}on{% endif %}">Home</a>
      <a href="/wines" class="{% if page == 'wines' %}on{% endif %}">Cellar</a>
      <a href="/inventory" class="{% if page == 'inventory' %}on{% endif %}">Stock</a>
      <a href="/costing" class="{% if page == 'costing' %}on{% endif %}">Cost</a>
      <a href="/purchasing" class="{% if page == 'purchasing' %}on{% endif %}">Buy</a>
      <a href="/invoices" class="{% if page == 'invoices' %}on{% endif %}">Bills</a>
      <a href="/invoices/scan" class="{% if page == 'scan' %}on{% endif %}">Scan</a>
      <a href="/collector" class="{% if page == 'collector' %}on{% endif %}">Prices</a>
      <a href="/connect" class="{% if page == 'connect' %}on{% endif %}">Connect</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

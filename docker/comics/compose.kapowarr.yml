# Optional. Kapowarr is the GetComics grabber, not the reader.
# Kavita stays the library. Do not run Import and Rename on these folders.
#
# On Unraid:
#   mkdir -p /mnt/user/appdata/kapowarr /mnt/user/downloads/kapowarr
#   docker compose -f /mnt/user/appdata/resto/docker/comics/compose.kapowarr.yml up -d
#
# Then in http://100.116.48.120:5656
#   Settings → ComicVine API key
#   Settings → FlareSolverr Base URL → http://flaresolverr:8191
#   Settings → Root Folders → add /comics and /manga (container paths)
#   Volumes → Library Import → Import  (not Import and Rename)
#
# FlareSolverr lives in its own container on manga-net. After recreate:
#   bash scripts/flaresolverr-attach.sh

name: kapowarr

services:
  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-America/New_York}
    ports:
      - "5656:5656"
    volumes:
      - ${KAPOWARR_DB:-/mnt/user/appdata/kapowarr}:/app/db
      - ${KAPOWARR_TEMP:-/mnt/user/downloads/kapowarr}:/app/temp_downloads
      - ${KAPOWARR_COMICS:-/mnt/user/media/book/comics}:/comics
      - ${KAPOWARR_MANGA:-/mnt/user/media/book/manga}:/manga

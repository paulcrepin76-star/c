# Posts YoLink (or any HA) fridge temps into Survey Cafe.
# Rename each temperature entity to sensor.<fridge>_temperature
# using the cellar slugs with underscores:
#   wine_cellar, walk_in_cooler, prep_cooler, line_cooler,
#   pastry_cooler, bar_cooler, walk_in_freezer

rest_command:
  cellar_fridge_reading:
    url: !secret resto_readings_url
    method: POST
    headers:
      Content-Type: application/json
      X-API-Key: !secret resto_api_key
    payload: >-
      {
        "slug": "{{ slug }}",
        "temp_f": {{ temp_f }},
        "humidity": {{ humidity }},
        "source": "yolink"
      }

automation:
  - id: survey_cafe_yolink_on_change
    alias: YoLink fridge change → Survey Cafe
    mode: queued
    max: 20
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {% set known = [
            'wine-cellar','walk-in-cooler','prep-cooler','line-cooler',
            'pastry-cooler','bar-cooler','walk-in-freezer'
          ] %}
          {% set eid = trigger.event.data.entity_id | default('') %}
          {% set slug = eid | replace('sensor.','') | replace('_temperature','') | replace('_','-') %}
          {% set new = trigger.event.data.new_state %}
          {{ eid.startswith('sensor.')
             and eid.endswith('_temperature')
             and slug in known
             and new is not none
             and new.state not in ['unknown','unavailable','none',''] }}
    action:
      - service: rest_command.cellar_fridge_reading
        data:
          slug: "{{ trigger.event.data.entity_id | replace('sensor.','') | replace('_temperature','') | replace('_','-') }}"
          temp_f: >
            {% set state = trigger.event.data.new_state %}
            {% set t = state.state | float(0) %}
            {% set unit = state.attributes.get('unit_of_measurement','') | string %}
            {% if 'C' in unit and 'F' not in unit %}
              {% set t = t * 9 / 5 + 32 %}
            {% endif %}
            {{ t | round(1) }}
          humidity: "{% set slug = trigger.event.data.entity_id | replace('sensor.','') | replace('_temperature','') %}{% set hum = states('sensor.' ~ slug ~ '_humidity') %}{{ hum | float if hum not in ['unknown','unavailable','none',''] else 'null' }}"

  - id: survey_cafe_yolink_every_10
    alias: YoLink fridge refresh → Survey Cafe
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/10"
    action:
      - repeat:
          for_each:
            - wine-cellar
            - walk-in-cooler
            - prep-cooler
            - line-cooler
            - pastry-cooler
            - bar-cooler
            - walk-in-freezer
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {% set eid = 'sensor.' ~ (repeat.item | replace('-', '_')) ~ '_temperature' %}
                    {{ states(eid) not in ['unknown','unavailable','none'] }}
              then:
                - service: rest_command.cellar_fridge_reading
                  data:
                    slug: "{{ repeat.item }}"
                    temp_f: >
                      {% set eid = 'sensor.' ~ (repeat.item | replace('-', '_')) ~ '_temperature' %}
                      {% set t = states(eid) | float(0) %}
                      {% set unit = state_attr(eid, 'unit_of_measurement') | string %}
                      {% if 'C' in unit and 'F' not in unit %}
                        {% set t = t * 9 / 5 + 32 %}
                      {% endif %}
                      {{ t | round(1) }}
                    humidity: "{% set hum_eid = 'sensor.' ~ (repeat.item | replace('-', '_')) ~ '_humidity' %}{% set hum = states(hum_eid) %}{{ hum | float if hum not in ['unknown','unavailable','none',''] else 'null' }}"

# Posts YoLink fridge temps into Survey Cafe.
# Entity IDs match the names already in the YoLink app.

rest_command:
  cellar_fridge_reading:
    url: !secret resto_readings_url
    method: POST
    headers:
      Content-Type: application/json
      X-API-Key: !secret resto_api_key
    payload: >-
      {
        "slug": "{{ slug }}",
        "temp_f": {{ temp_f }},
        "humidity": {{ humidity }},
        "source": "yolink"
      }

automation:
  - id: survey_cafe_yolink_on_change
    alias: YoLink fridge change → Survey Cafe
    mode: queued
    max: 20
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {% set map = {
            'sensor.walkin_cooler_temperature': 'walk-in-cooler',
            'sensor.prep_fridge_temperature': 'prep-cooler',
            'sensor.dessert_fridge_temperature': 'pastry-cooler',
            'sensor.soda_fridge_temperature': 'bar-cooler',
            'sensor.salad_fridge_temperature': 'salad-fridge',
            'sensor.coffee_station_temperature': 'coffee-station',
            'sensor.walk_in_freezer_temperature': 'walk-in-freezer'
          } %}
          {% set eid = trigger.event.data.entity_id | default('') %}
          {% set new = trigger.event.data.new_state %}
          {{ eid in map
             and new is not none
             and new.state not in ['unknown','unavailable','none',''] }}
    action:
      - service: rest_command.cellar_fridge_reading
        data:
          slug: >
            {% set map = {
              'sensor.walkin_cooler_temperature': 'walk-in-cooler',
              'sensor.prep_fridge_temperature': 'prep-cooler',
              'sensor.dessert_fridge_temperature': 'pastry-cooler',
              'sensor.soda_fridge_temperature': 'bar-cooler',
              'sensor.salad_fridge_temperature': 'salad-fridge',
              'sensor.coffee_station_temperature': 'coffee-station',
              'sensor.walk_in_freezer_temperature': 'walk-in-freezer'
            } %}
            {{ map[trigger.event.data.entity_id] }}
          temp_f: >
            {% set state = trigger.event.data.new_state %}
            {% set t = state.state | float(0) %}
            {% set unit = state.attributes.get('unit_of_measurement','') | string %}
            {% if 'C' in unit and 'F' not in unit %}
              {% set t = t * 9 / 5 + 32 %}
            {% endif %}
            {{ t | round(1) }}
          humidity: "{% set hum = states(trigger.event.data.entity_id | replace('_temperature', '_humidity')) %}{{ hum | float if hum not in ['unknown','unavailable','none',''] else 'null' }}"

  - id: survey_cafe_yolink_every_10
    alias: YoLink fridge refresh → Survey Cafe
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/10"
    action:
      - repeat:
          for_each:
            - {entity: sensor.walkin_cooler_temperature, slug: walk-in-cooler}
            - {entity: sensor.prep_fridge_temperature, slug: prep-cooler}
            - {entity: sensor.dessert_fridge_temperature, slug: pastry-cooler}
            - {entity: sensor.soda_fridge_temperature, slug: bar-cooler}
            - {entity: sensor.salad_fridge_temperature, slug: salad-fridge}
            - {entity: sensor.coffee_station_temperature, slug: coffee-station}
            - {entity: sensor.walk_in_freezer_temperature, slug: walk-in-freezer}
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item.entity) not in ['unknown','unavailable','none'] }}"
              then:
                - service: rest_command.cellar_fridge_reading
                  data:
                    slug: "{{ repeat.item.slug }}"
                    temp_f: >
                      {% set t = states(repeat.item.entity) | float(0) %}
                      {% set unit = state_attr(repeat.item.entity, 'unit_of_measurement') | string %}
                      {% if 'C' in unit and 'F' not in unit %}
                        {% set t = t * 9 / 5 + 32 %}
                      {% endif %}
                      {{ t | round(1) }}
                    humidity: "{% set hum = states(repeat.item.entity | replace('_temperature', '_humidity')) %}{{ hum | float if hum not in ['unknown','unavailable','none',''] else 'null' }}"
